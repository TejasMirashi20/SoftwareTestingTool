services:
  - type: web
    name: complex-code-testing-dashboard
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: MAX_CODE_BYTES
        value: "100000"
      - key: SANDBOX_MEMORY_MB
        value: "768"
      - key: MAX_CONCURRENT_ANALYSES
        value: "2"
